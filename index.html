<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    .video-container { width: 100%; height: 100%; position: relative; }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>

<div class="video-container">
  <!-- muted & autoplay لضمان التشغيل التلقائي على كل المتصفحات الهواتف والحاسوب -->
  <video id="video" controls autoplay muted playsinline></video>
</div>

<script>
  const video = document.getElementById('video');
  // رابط البث M3U8 المباشر
  const streamUrl = 'https://v3.web.syriatek.net/sps1.m3u8';

  function playStream() {
    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play().catch(err => console.log("Autoplay blocked:", err));
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // دعم متصفحات Safari و iOS
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', function() {
        video.play().catch(err => console.log("Autoplay blocked:", err));
      });
    }
  }

  // تشغيل عند تحميل الصفحة فوراً
  window.addEventListener('DOMContentLoaded', playStream);
</script>

</body>
</html>
